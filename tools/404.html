<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Материал недоступен | Искра Надежды</title>
  <base href="/">
  <script>
    if (location.hostname.endsWith(".github.io")) {
      document.querySelector("base").href = "/helpautism/";
    }
  </script>
  <link rel="icon" type="image/png" href="wp-content/uploads/2017/01/logo-1.png">
</head>
<body class="ha-error-page">
  <!-- SITE HEADER -->
  <main class="ha-error">
    <h1>Материал недоступен</h1>
    <p>После кибератаки, которая затронула наш прежний сайт на хостинге Beget, часть страниц и файлов не сохранилась. Мы восстанавливаем архив и возвращаем доступные материалы на сайт.</p>
    <p>Спасибо, что остаётесь с нами.</p>
    <nav class="ha-error__actions" aria-label="Продолжить просмотр">
      <a id="home" class="ha-btn ha-btn--cta" href="./">На главную</a>
      <a id="back" class="ha-btn ha-btn--ghost" href="category/news/">К новостям</a>
    </nav>
  </main>
  <script>
    (function () {
      if (!document.referrer) return;
      const base = new URL(document.baseURI);
      const previous = new URL(document.referrer);
      if (previous.origin === location.origin && previous.pathname.startsWith(base.pathname) &&
          previous.pathname !== location.pathname && previous.pathname !== base.pathname + "404.html") {
        const back = document.getElementById("back");
        back.href = previous.href;
        back.textContent = "Вернуться в предыдущий раздел";
      }
    })();
  </script>
</body>
</html>
