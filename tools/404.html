<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | Искра надежды</title>
<style>body{font-family:"Open Sans",Arial,sans-serif;text-align:center;padding:80px 20px;color:#404040}h1{font-family:Montserrat,Arial,sans-serif;color:#e96656;font-size:64px;margin:0}a{display:inline-block;margin-top:20px;padding:12px 28px;background:#e96656;color:#fff;border-radius:4px;text-decoration:none}</style>
<script>
  // на GitHub Pages сайт лежит в подпапке /helpautism/ — отправляем на главную этой подпапки
  (function(){var p=location.pathname.split("/").filter(Boolean);var base=/\.github\.io$/.test(location.hostname)&&p.length?"/"+p[0]+"/":"/";document.addEventListener("DOMContentLoaded",function(){document.getElementById("home").href=base;});})();
</script></head>
<body><h1>404</h1><p>Такой страницы нет. Возможно, она не сохранилась в архиве.</p><a id="home" href="/">На главную</a></body></html>
