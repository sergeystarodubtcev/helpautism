name: Wayback probe (main page + list of captures)

on:
  workflow_dispatch:
  push:
    branches: [claude/eager-curie-nnh11r]
    paths:
      - tools/wayback_page.py
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: List of captures
        run: |
          mkdir -p archive/probe
          curl -sS --retry 5 --retry-delay 5 -m 300 "https://web.archive.org/cdx/search/cdx?url=helpautism.ru&matchType=domain&fl=timestamp,original,mimetype,statuscode,length&collapse=digest" -o archive/probe/cdx_all.txt || true
          wc -l archive/probe/cdx_all.txt || true
          awk '$3 ~ /html/ {print substr($1,1,4)}' archive/probe/cdx_all.txt | sort | uniq -c || true
      - name: Main page 2020 with all assets
        run: python3 tools/wayback_page.py --ts 20201020150025 --out archive/probe/2020 /
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/probe
          git commit -m "Разведка архива: список снимков и главная 2020" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
