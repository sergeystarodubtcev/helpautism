name: Deploy to Yandex Cloud

# 1) облачная функция (админка + формы) -> Yandex Cloud Functions
# 2) сборка сайта с адресом функции
# 3) выкладка в бакет Yandex Object Storage
#
# Settings → Secrets and variables → Actions:
#   секреты:    YC_S3_KEY_ID, YC_S3_SECRET  — статический ключ сервисного аккаунта (бакет)
#               YC_SA_KEY                   — авторизованный ключ того же аккаунта (JSON целиком)
#               GH_CONTENT_TOKEN            — fine-grained токен GitHub (Contents: read/write) — для сохранения из админки
#               ADMIN_PASSWORD              — пароль входа в админку
#               SMTP_PASSWORD               — пароль приложения Яндекс 360 для helpautismvrn@yandex.ru
#               YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY — онлайн-пожертвования (ЮKassa), необязательно
#   переменные: YC_FOLDER_ID (обязательно для функции), YC_BUCKET (по умолчанию helpautism.ru)
# Без ключей шаги пропускаются.

on:
  push:
    branches: [main, claude/eager-curie-nnh11r]
  workflow_dispatch:

concurrency:
  group: yandex-cloud
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: ${{ vars.YC_BUCKET || 'helpautism.ru' }}
      S3: aws --endpoint-url=https://storage.yandexcloud.net s3
      YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      FUNC: helpautism-api
      MAIL: helpautismvrn@yandex.ru
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Нет YC_S3_KEY_ID / YC_S3_SECRET — выкладка в Яндекс Облако пропущена."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$YC_SA_KEY" ] && [ -n "$YC_FOLDER_ID" ]; then echo "func=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::Нет YC_SA_KEY / YC_FOLDER_ID — облачная функция (админка, формы) не обновляется."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'

      # ---------- облачная функция ----------
      - name: Install yc CLI
        if: steps.check.outputs.skip != '1' && steps.check.outputs.func == '1'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Deploy function
        if: steps.check.outputs.skip != '1' && steps.check.outputs.func == '1'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_CONTENT_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_RECEIPT: ${{ vars.YOOKASSA_RECEIPT }}
        run: |
          set -e
          # ключ мог вставиться без фигурных скобок или с лишними пробелами — чиним и проверяем поля (значения не печатаются)
          python3 - "$RUNNER_TEMP/key.json" <<'PY'
          import json, os, sys
          s = os.environ["YC_SA_KEY"].strip().lstrip("﻿")
          doc = None
          for cand in (s, "{" + s + "}", "{" + s.rstrip(",") + "}", "{" + s.strip("{}").strip().rstrip(",") + "}"):
              try:
                  doc = json.loads(cand); break
              except Exception:
                  pass
          if not isinstance(doc, dict):
              sys.exit("::error::Секрет YC_SA_KEY — не JSON. Вставьте содержимое файла authorized_key.json целиком, от { до }.")
          need = ["id", "service_account_id", "private_key"]
          miss = [k for k in need if not doc.get(k)]
          print("Поля ключа:", ", ".join(sorted(doc)))
          if miss:
              sys.exit("::error::В ключе YC_SA_KEY не хватает полей: " + ", ".join(miss) + ". Скопируйте файл authorized_key.json целиком.")
          json.dump(doc, open(sys.argv[1], "w"))
          PY
          yc config profile create ci >/dev/null 2>&1 || true
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set folder-id "$YC_FOLDER_ID"
          yc serverless function get --name "$FUNC" >/dev/null 2>&1 || yc serverless function create --name "$FUNC" --description "helpautism.ru: админка и формы"
          yc serverless function allow-unauthenticated-invoke --name "$FUNC" >/dev/null
          SECRETS=$(python3 -c 'import base64,json,os; print(base64.urlsafe_b64encode(json.dumps({
            "ADMIN_PASSWORD": os.environ["ADMIN_PASSWORD"], "GH_TOKEN": os.environ["GH_CONTENT_TOKEN"],
            "GH_REPO": os.environ["GITHUB_REPOSITORY"], "GH_BRANCH": os.environ["GITHUB_REF_NAME"],
            "SMTP_USER": os.environ["MAIL"], "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"], "FORMS_TO": os.environ["MAIL"],
            "YOOKASSA_SHOP_ID": os.environ.get("YOOKASSA_SHOP_ID", ""), "YOOKASSA_SECRET_KEY": os.environ.get("YOOKASSA_SECRET_KEY", ""),
            "YOOKASSA_RECEIPT": os.environ.get("YOOKASSA_RECEIPT", "")}).encode()).decode().rstrip("="))')
          echo "::add-mask::$SECRETS"
          (cd functions/api && zip -qr "$RUNNER_TEMP/api.zip" .)
          yc serverless function version create --function-name "$FUNC" --runtime python312 --entrypoint index.handler \
            --memory 128m --execution-timeout 30s --source-path "$RUNNER_TEMP/api.zip" \
            --environment "HA_SECRETS=$SECRETS" >/dev/null
          ID=$(yc serverless function get --name "$FUNC" --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "HA_API_URL=https://functions.yandexcloud.net/$ID" >> "$GITHUB_ENV"
          echo "Функция: https://functions.yandexcloud.net/$ID"
          rm -f "$RUNNER_TEMP/key.json"
      - name: Check function
        if: steps.check.outputs.skip != '1' && steps.check.outputs.func == '1'
        run: |
          sleep 5
          A=$(curl -s -o /tmp/a.json -w "%{http_code}" -X POST "$HA_API_URL?a=login" -H 'Content-Type: application/json' -d '{"password":"__wrong__"}'); echo "login с неверным паролем: $A $(cat /tmp/a.json)"
          B=$(curl -s -o /tmp/b.json -w "%{http_code}" "$HA_API_URL?a=ping"); echo "ping без токена: $B $(cat /tmp/b.json)"
          [ "$A" = 403 ] && [ "$B" = 401 ] || { echo "::error::Функция отвечает не так, как ожидалось"; exit 1; }
          echo "Функция работает"

      # ---------- сайт ----------
      - name: Build site
        if: steps.check.outputs.skip != '1'
        env:
          HA_FORCE_HTTPS: "1"   # сертификат на helpautism.ru выпущен — http перенаправляется на https
        run: python3 tools/build_site.py
      - name: Upload media and assets (only changed by size)
        if: steps.check.outputs.skip != '1'
        run: |
          $S3 sync site/ "s3://$BUCKET/" --size-only --no-progress \
            --exclude "*.html" --exclude "*.json" --exclude "*.xml" --exclude "*.txt" --exclude "*.css" --exclude "*.js" \
            --cache-control "public, max-age=2592000"
      - name: Upload styles and scripts
        if: steps.check.outputs.skip != '1'
        run: |
          $S3 sync site/ "s3://$BUCKET/" --no-progress --exclude "*" --include "*.css" --include "*.js" --cache-control "public, max-age=3600"
          $S3 cp site/assets/config.js "s3://$BUCKET/assets/config.js" --cache-control "no-cache"
      - name: Upload pages
        if: steps.check.outputs.skip != '1'
        run: |
          $S3 sync site/ "s3://$BUCKET/" --no-progress --exclude "*" --include "*.html" --include "*.json" --include "*.xml" --include "*.txt" \
            --cache-control "no-cache" --delete
      - name: Website settings
        if: steps.check.outputs.skip != '1'
        run: |
          $S3 website "s3://$BUCKET/" --index-document index.html --error-document 404.html
          echo "Готово: https://$BUCKET.website.yandexcloud.net/  (админка: /admin/)"
