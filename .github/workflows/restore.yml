name: Restore from Wayback Machine

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Дата снимка (ГГГГММДДччммсс)"
        default: "20201020150025"
  push:
    branches: [claude/eager-curie-nnh11r]
    paths:
      - tools/wayback_mirror.py
      - .github/workflows/restore.yml

permissions:
  contents: write

concurrency:
  group: restore
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Mirror 2020 snapshot (full design)
        run: python3 tools/wayback_mirror.py --target "${{ github.event.inputs.target || '20201020150025' }}" --out archive/2020
      - name: Mirror latest pages (texts only)
        run: python3 tools/wayback_mirror.py --target 20261011000000 --out archive/latest --html-only
      - name: Commit
        run: |
          du -sh archive || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Архив helpautism.ru из web.archive.org" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
