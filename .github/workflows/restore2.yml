name: Restore from Wayback (parallel, incremental)

on:
  workflow_dispatch:
  push:
    branches: [claude/eager-curie-nnh11r]
    paths:
      - .github/workflows/restore2.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: html
            args: --html-only --manifest manifest-html.json
          - name: assets
            args: --include '^/wp-(content/(themes|plugins)|includes)/' --manifest manifest-assets.json --workers 6
          - name: uploads
            args: --include '^/wp-content/uploads/' --manifest manifest-uploads.json --workers 6
    steps:
      - uses: actions/checkout@v4
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/save.sh <<'EOF'
          #!/bin/bash
          cd "$GITHUB_WORKSPACE"
          git add archive/2020 archive/latest 2>/dev/null
          [ "$1" = final ] && git add archive/cdx.json 2>/dev/null
          git commit -qm "Архив helpautism.ru (${{ matrix.name }}): $(find archive -type f | wc -l) файлов" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          EOF
          chmod +x /tmp/save.sh
      - name: Mirror (${{ matrix.name }})
        run: |
          ( while sleep 600; do /tmp/save.sh; done ) &
          python3 tools/wayback_mirror.py --target 20201020150025 --out archive/2020 ${{ matrix.args }}
          if [ "${{ matrix.name }}" = html ]; then
            python3 tools/wayback_mirror.py --target 20261011000000 --out archive/latest --html-only
          fi
      - name: Final save
        if: always()
        run: /tmp/save.sh final
