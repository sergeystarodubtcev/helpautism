name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/eager-curie-nnh11r]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html 404.html .nojekyll assets data _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
