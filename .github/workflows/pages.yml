name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/eager-curie-nnh11r]
  workflow_dispatch:
  # пересобрать сайт, когда закончилось скачивание архива
  workflow_run:
    workflows:
      - "Restore from Wayback (parallel, incremental) v2"
      - "Second pass (full CDX, retry missing files)"
      - "Fetch page requisites (design files first)"
      - "Fetch latest pages (2021-2026 posts)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site from archive
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
